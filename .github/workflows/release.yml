name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: read # for checkout

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    uses: ./.github/workflows/prepare-matrix.yml
  build:
    name: Validate Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gradle-build
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar-${{ github.sha }}
          path: mod-jar
  compatibility-tests:
    needs:
      - build
      - prepare-matrix
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mod-jar-${{ github.sha }}
          path: mod-jar
      - uses: ./.github/actions/fabric-compatibility-check
        with:
          mc_version: ${{ matrix.mc_version }}
          loader_version: ${{ matrix.loader_version }}
          installer_version: ${{ matrix.installer_version }}
          additional_mod_urls: ${{ matrix.additional_mod_urls }}
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: compatibility-tests
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    outputs:
      is_release: ${{ steps.semantic.outputs.is_release }}
      release_tag: ${{ steps.semantic.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.VERSION_BUMPER_PRIVATE_KEY }}
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-semantic-release
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install semantic-release plugins
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/exec \
            @semantic-release/git
      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "is_release=false" >> "$GITHUB_OUTPUT"
          semantic-release
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: release
    if: needs.release.outputs.is_release == 'true'
    permissions:
      contents: write # to be able to add artifact to GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mod-jar-${{ github.sha }}
          path: mod-jar
      - name: Relabel jar with the released version
        run: |
          # The jar was built before the release job bumped mod_version, so
          # it still carries the previous release's version in its filename
          # and embedded fabric.mod.json. mod_version is cosmetic only (it
          # doesn't affect compiled bytecode or dependencies), so patch it
          # in place instead of paying for a second full build.
          VERSION="${{ needs.release.outputs.release_tag }}"
          VERSION="${VERSION#v}"
          cd mod-jar
          MAIN_JAR=$(ls fabric-discord-notifier-*.jar | grep -v -- -sources)
          SOURCES_JAR=$(ls fabric-discord-notifier-*-sources.jar)

          mkdir patch && cd patch
          unzip -q "../$MAIN_JAR" fabric.mod.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" fabric.mod.json
          zip -q "../$MAIN_JAR" fabric.mod.json
          cd .. && rm -rf patch

          mv "$MAIN_JAR" "fabric-discord-notifier-$VERSION.jar"
          mv "$SOURCES_JAR" "fabric-discord-notifier-$VERSION-sources.jar"
      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          files: "mod-jar/*.jar"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
