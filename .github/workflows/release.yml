name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: read # for checkout

jobs:
  build:
    name: Validate Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gradle-build
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
  compatibility-tests:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mc_version: [1.20.1, 1.21.11]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-jar
      - uses: ./.github/actions/fabric-compatibility-check
        with:
          mc_version: ${{ matrix.mc_version }}
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: compatibility-tests
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    outputs:
      is_release: ${{ steps.release-check.outputs.is_release }}
      release_tag: ${{ steps.release-check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.VERSION_BUMPER_PRIVATE_KEY }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install semantic-release plugins
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/exec \
            @semantic-release/git
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release
      - name: Output release information
        id: release-check
        shell: bash
        run: |
          TAG=$(git describe --tags --abbrev=0 --exact-match 2>/dev/null || true)

          if [ -z "$TAG" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: release
    if: needs.release.outputs.is_release == 'true'
    permissions:
      contents: write # to be able to add artifact to GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gradle-build
      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          files: "build/libs/*.jar"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
