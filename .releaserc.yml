branches:
  - "main"
tagFormat: "v${version}"
plugins:
  - - "@semantic-release/commit-analyzer"
    - releaseRules:
        - type: fix
          release: patch
        - type: refactor
          release: patch
        - type: feat
          release: minor
        - breaking: true
          release: major
  - "@semantic-release/release-notes-generator"
  - - "@semantic-release/exec"
    - prepareCmd: sed -i s/^mod_version=.*/mod_version=${nextRelease.version}/ gradle.properties
      successCmd: 'echo "is_release=true" >> $GITHUB_OUTPUT && echo "release_tag=${nextRelease.gitTag}" >> $GITHUB_OUTPUT'
  - - "@semantic-release/git"
    - assets:
        - gradle.properties
      message: "[github-actions]: release ${nextRelease.version} [skip ci]"
  - "@semantic-release/github"
